[project]
name = "ai-eyes-mcp"
version = "1.0.0"
description = "Grounded visual evaluator MCP server — honest image judgment via SigLIP2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" },
]
dependencies = [
    "fastmcp>=3.0",
    "torch>=2.0",
    "transformers>=4.40",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
ai-eyes-mcp = "ai_eyes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_eyes_mcp"]
